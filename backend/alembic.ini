# Alembic configuration — voiceagent-platform backend

[alembic]
script_location = alembic
prepend_sys_path = .
# Overridden at runtime from app.core.config (DATABASE_URL); this is a fallback.
sqlalchemy.url = sqlite+aiosqlite:///./voiceagent.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
